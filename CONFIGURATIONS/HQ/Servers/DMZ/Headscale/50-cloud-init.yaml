etwork:
  version: 2
  renderer: networkd
  ethernets:
    enp0s2:
      dhcp4: false
      dhcp6: false
      addresses:
      - 10.0.254.20/24
      nameservers:
        addresses: [172.29.29.30, 172.30.30.30]
      routes:
      - to: default
        via: 10.0.254.1

    enp0s3:
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.0.255.20/24
      routing-policy:
        - from: 10.0.255.20
          table: 101
      routes:
        - to: default
          via: 10.0.255.1
          table: 101

        - to: 10.0.255.0/24
          via: 0.0.0.0
          scope: link
          table: 101