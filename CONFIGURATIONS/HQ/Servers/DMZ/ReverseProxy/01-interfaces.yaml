network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s3:
      addresses:
        - 10.0.254.15/24
      routes:
        - to: default
          via: 10.0.254.1
      nameservers:
        addresses: [172.29.29.30, 172.30.30.30]

    enp0s4:
      addresses:
        - 10.0.255.15/24
      routing-policy:
        - from: 10.0.255.15
          table: 101
      routes:
        - to: default
          via: 10.0.255.1
          table: 101

        - to: 10.0.255.0/24
          via: 0.0.0.0
          scope: link
          table: 101
