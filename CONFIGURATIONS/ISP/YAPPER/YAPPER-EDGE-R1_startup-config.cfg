logging host 172.17.255.3
ipv6 route 2001:470:2171::/48 Null0
ipv6 router ospf 20
 router-id 2.2.1.1
 distribute-list route-map DENY_TAG_IN_v6 in
 default-information originate route-map BGP_TO_OSPF_v6
 distance ospf external 220 
 redistribute bgp 65102 route-map BGP_TO_OSPF_v6
!
!
ipv6 prefix-list DEFAULT_v6_PREFIX seq 5 permit ::/0
route-map DENY_TAG_IN_v4 deny 10 
 match tag 666
!
route-map DENY_TAG_IN_v4 permit 20 
!
route-map DENY_TAG_IN_v6 deny 10 
 match tag 666
!
route-map DENY_TAG_IN_v6 permit 20 
!
route-map ADVERTISE_DEFAULT_CONDITIONALLY permit 10 
 match ip address prefix-list DEFAULT_PREFIX
!
route-map SET-LP-OUT-v6 permit 10 
 match ipv6 address prefix-list DEFAULT_v6_PREFIX
 set local-preference 200
!
route-map SET-LP-OUT-v6 permit 20 
!
route-map BGP_TO_OSPF permit 10 
 match ip address DEFAULT_ROUTE
 set metric 200
 set metric-type type-2
 set tag 666
!
route-map BGP_TO_OSPF permit 20 
!
route-map ADVERTISE_DEFAULT_v6_CONDITIONALLY permit 10 
 match ipv6 address prefix-list DEFAULT_v6_PREFIX
!
route-map SET-LP-OUT permit 10 
 match ip address DEFAULT_ROUTE
 set local-preference 200
!
route-map SET-LP-OUT permit 20 
!
route-map BGP_TO_OSPF_v6 permit 10 
 match ipv6 address prefix-list DEFAULT_v6_PREFIX
 set metric 200
 set metric-type type-2
 set tag 666
!
route-map BGP_TO_OSPF_v6 permit 20 
