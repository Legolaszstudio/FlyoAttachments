 address-family ipv4
  network 0.0.0.0 route-map ADVERTISE_DEFAULT_CONDITIONALLY
  network 172.17.0.0
  no neighbor 2001:470:2171:AAAA:AAAA:A:0:39 activate
  no neighbor 2001:DB8:DEAD:BEEF::2 activate
  no neighbor 2001:DB8:DEAD:BEEF::11 activate
  no neighbor 2001:DB8:DEAD:BEEF::31 activate
  neighbor 172.17.5.38 activate
  neighbor 172.17.5.38 next-hop-self
  neighbor 172.18.111.1 activate
  neighbor 172.18.111.1 send-community
  neighbor 172.18.111.1 route-map SET-LP-OUT out
  neighbor 172.18.111.10 activate
  neighbor 172.18.111.10 send-community
  neighbor 172.18.111.10 route-map SET-LP-OUT out
  neighbor 172.18.111.30 activate
  neighbor 172.18.111.30 send-community
  maximum-paths 2
  distance 130 172.18.111.1 0.0.0.0 DEFAULT_ROUTE
  distance 130 172.18.111.10 0.0.0.0 DEFAULT_ROUTE
 exit-address-family
 !
 address-family ipv6
  maximum-paths 2
  distance bgp 130 200 200
  network ::/0 route-map ADVERTISE_DEFAULT_v6_CONDITIONALLY
  network 2001:470:2171::/48
  neighbor 2001:470:2171:AAAA:AAAA:A:0:39 activate
  neighbor 2001:470:2171:AAAA:AAAA:A:0:39 next-hop-self
  neighbor 2001:DB8:DEAD:BEEF::2 activate
  neighbor 2001:DB8:DEAD:BEEF::2 send-community
  neighbor 2001:DB8:DEAD:BEEF::2 route-map SET-LP-OUT-v6 out
  neighbor 2001:DB8:DEAD:BEEF::11 activate
  neighbor 2001:DB8:DEAD:BEEF::11 send-community
  neighbor 2001:DB8:DEAD:BEEF::11 route-map SET-LP-OUT-v6 out
  neighbor 2001:DB8:DEAD:BEEF::31 activate
  neighbor 2001:DB8:DEAD:BEEF::31 send-community
