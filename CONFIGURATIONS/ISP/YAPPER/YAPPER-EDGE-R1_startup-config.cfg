 network 172.17.5.0 0.0.0.3 area 0
 network 172.17.5.36 0.0.0.3 area 0
 default-information originate route-map BGP_TO_OSPF
 distribute-list route-map DENY_TAG_IN_v4 in
 distance ospf external 220
!
router bgp 65102
 bgp log-neighbor-changes
 neighbor 2001:470:2171:AAAA:AAAA:A:0:39 remote-as 65102
 neighbor 2001:470:2171:AAAA:AAAA:A:0:39 timers 60 180
 neighbor 2001:DB8:DEAD:BEEF::2 remote-as 65101
 neighbor 2001:DB8:DEAD:BEEF::2 timers 60 180
